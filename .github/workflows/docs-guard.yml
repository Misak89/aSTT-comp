name: docs-guard

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  docs-guard:
    name: docs-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Docs guard (pull_request)
        if: github.event_name == 'pull_request'
        run: >
          python scripts/verify_docs_guard.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.sha }}"

      - name: Docs guard (push)
        if: github.event_name == 'push'
        run: >
          python scripts/verify_docs_guard.py
          --base "${{ github.event.before }}"
          --head "${{ github.sha }}"

      - name: Supply-chain guard
        run: >
          python scripts/supply_chain_guard.py
