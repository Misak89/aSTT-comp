name: install-portability

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  install-portability:
    name: install-portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: brew install ffmpeg

      - name: Windows installer dry-run
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          ./scripts/install_astt_windows.ps1
          -DryRun
          -StrictPrereq

      - name: macOS installer dry-run
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/install_astt_macos.sh --dry-run --strict-prereq

      - name: Install backend test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        shell: bash
        run: npm --prefix frontend ci

      - name: Portability install smoke
        shell: bash
        run: >
          python scripts/install_portability_smoke.py
          --level ci
          --require-ffmpeg
          --pytest-basetemp runtime/pytest_basetemp_ci
